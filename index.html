<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤍♥️Watch More♥️🤍</title>
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="🤍♥️Watch More♥️🤍">
    <meta property="og:description" content="watch more">
    <meta property="og:image" content="images/1.png">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://example.com">
    
    <!-- Basic Styling -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            text-align: center;
        }
        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 90%;
            width: 400px;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: #e91e63;
        }
        p {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 1.5rem;
        }
        .image-placeholder {
            width: 100%;
            height: auto;
            border-radius: 10px;
            border: 2px solid #eee;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🤍♥️ Watch More ♥️🤍</h1>
        <p>watch more</p>
        <!-- Make sure to create an 'images' folder and put '1.png' inside it -->
        <img src="images/1.png" alt="Watch More Content" class="image-placeholder" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        <p style="display:none; font-size: 0.9rem; color: #999;">(Image: images/1.png not found. Please ensure the file exists in the correct folder.)</p>
    </div>

</body>
</html>
